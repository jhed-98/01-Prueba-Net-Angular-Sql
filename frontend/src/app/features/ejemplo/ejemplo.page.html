<div class="space-y-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-slate-800">Módulo de Ejemplo</h2>
      <p class="text-xs text-slate-500">Demostración completa de arquitectura Feature-Driven con Signals y UI Kit.</p>
    </div>
    <button uiButton variant="primary" (click)="abrirModalCreacion()">
      + Nuevo Registro
    </button>
  </div>

  <!-- Tabla de Registros -->
  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xs">
    <table class="w-full text-left text-xs">
      <thead class="border-b border-slate-200 bg-slate-50 font-semibold text-slate-700">
        <tr>
          <th class="px-4 py-3">ID</th>
          <th class="px-4 py-3">Nombre</th>
          <th class="px-4 py-3">Categoría</th>
          <th class="px-4 py-3 text-center">Acción</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (item of items(); track item.id) {
          <tr class="hover:bg-slate-50/70 transition-colors">
            <td class="px-4 py-3 font-medium text-slate-500">#{{ item.id }}</td>
            <td class="px-4 py-3 font-medium text-slate-800">{{ item.nombre }}</td>
            <td class="px-4 py-3">
              <span class="inline-flex rounded-md bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600">
                {{ item.categoria }}
              </span>
            </td>
            <td class="px-4 py-3 text-center">
              <button
                uiButton
                variant="destructive"
                size="sm"
                (click)="eliminarItem(item.id)"
              >
                Eliminar
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-4 py-8 text-center text-slate-400">
              No hay registros disponibles.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Modal de Creación -->
  <app-ui-modal
    [open]="modalAbierto()"
    title="Nuevo Registro"
    description="Ingresa los datos para registrar un nuevo elemento."
    (closed)="modalAbierto.set(false)"
  >
    <div class="space-y-4">
      <app-ui-input
        label="Nombre"
        placeholder="Ej. Configuración D"
        [value]="nombreInput()"
        (input)="nombreInput.set($any($event.target).value)"
      />
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
        <app-ui-select
          [options]="['General', 'Avanzado', 'Especial']"
          [value]="categoriaInput()"
          (valueChange)="categoriaInput.set(String($event))"
          placeholder="Seleccione categoría"
          [searchable]="true"
          searchPlaceholder="Buscar categoría..."
        />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button uiButton variant="outline" (click)="modalAbierto.set(false)">Cancelar</button>
        <button uiButton variant="primary" (click)="guardarNuevo()">Guardar</button>
      </div>
    </div>
  </app-ui-modal>

  <!-- Toast Notification -->
  <app-ui-toast
    [open]="toast().open"
    [tone]="toast().tone"
    [message]="toast().message"
    (closed)="cerrarToast()"
  />
</div>
