<div class="space-y-1">
  @if (label()) {
    <label class="block text-xs font-semibold text-slate-700">{{ label() }}</label>
  }
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="value()"
    (input)="onInput($event)"
    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs text-slate-800 placeholder-slate-400 shadow-xs focus:border-red-500 focus:outline-hidden focus:ring-1 focus:ring-red-500 disabled:bg-slate-100 disabled:text-slate-400"
  />
</div>
