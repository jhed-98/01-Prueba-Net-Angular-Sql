@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs animate-in fade-in-0">
    <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl border border-slate-100 scale-100 transition-all">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-800">{{ title() }}</h2>
          @if (description()) {
            <p class="text-xs text-slate-500 mt-0.5">{{ description() }}</p>
          }
        </div>
        <button
          type="button"
          (click)="closed.emit()"
          class="size-7 inline-flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors cursor-pointer text-sm font-semibold"
          aria-label="Cerrar modal"
        >
          ✕
        </button>
      </div>
      <div class="py-4">
        <ng-content />
      </div>
    </div>
  </div>
}
